[tool.poetry]
name = "grantscout"
version = "1.0.0"
description = "Automated grant discovery tool – scrape, filter, alert, and export federal funding opportunities."
authors = ["GrantScout Contributors"]
readme = "README.md"
packages = [{ include = "grantscout" }]

[tool.poetry.scripts]
grantscout = "grantscout.cli:app"

[tool.poetry.dependencies]
python = "^3.10"
typer = {version = "^0.15", extras = ["all"]}
httpx = "^0.28"
rich = "^13.7"
python-dotenv = "^1.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
